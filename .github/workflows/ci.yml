# Unit and integration tests, the bundled ffmpeg and the app build, on GitHub's Apple Silicon
# runners (spec §7). No TV needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pinned, so a change to the runner image can't move the toolchain under us. Xcode 26.6's
      # Swift (6.3.3) crashes on one closure shape; RemoteView's TracksMenu says how it's avoided.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      - name: Restore the bundled ffmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build the bundled ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja autoconf automake libtool pkgconf
          scripts/build-ffmpeg.sh

      # Saved as soon as it's built rather than when the job ends: a failure later on (a test,
      # say) must not throw away a twenty-minute ffmpeg build.
      - name: Save the bundled ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Check the bundled ffmpeg
        run: scripts/check-ffmpeg.sh

      - name: Make test media (with Homebrew's ffmpeg, which has the encoders it needs)
        run: |
          brew install ffmpeg
          scripts/make-test-media.sh
          python3 -I scripts/check-test-media.py

      # In parallel, as locally: the suites that convert video overlap, where serially they'd sum
      # to a quarter of an hour on the runner's slow encoder. Tests that time a process spawn or a
      # socket allow for the contention through TestSupport.timeScale.
      - name: Core and UI tests with Homebrew's ffmpeg
        run: scripts/test-core.sh

      - name: Core and UI tests with the bundled ffmpeg
        run: |
          export PAPERPLANE_FFMPEG="$PWD/vendor/ffmpeg/bin/ffmpeg"
          export PAPERPLANE_FFPROBE="$PWD/vendor/ffmpeg/bin/ffprobe"
          scripts/test-core.sh

      - name: Extension tests, types and build
        working-directory: extension
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck
          npm run build

      - name: Build the app (warnings are errors)
        run: >
          xcodebuild -project app/PaperPlane.xcodeproj -scheme PaperPlane -configuration Release
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES build
